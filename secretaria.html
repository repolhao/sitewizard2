<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel da Secretaria | Wizard WIP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .admin-wrap { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
  .table-card { background: #fff; border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; box-shadow: var(--shadow-sm); }
  table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13.5px; }
  th, td { padding: 14px 16px; border-bottom: 1px solid var(--line); }
  th { background: #f8fafc; color: var(--navy); font-weight: 700; }
  .badge-pago { background: #dcfce7; color: #15803d; padding: 4px 8px; border-radius: 4px; font-weight: 700; font-size: 11px; }
  .status-select { padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); font-size: 12px; font-weight: 600; cursor: pointer; }
  .btn-action { padding: 8px 14px; font-size: 13px; border-radius: 6px; cursor: pointer; font-weight: 600; border: none; }
  .btn-refresh { background: var(--navy); color: #fff; }
  .btn-demo { background: #2563eb; color: #fff; margin-left: 8px; }
  .btn-clear { background: #ef4444; color: #fff; margin-left: 8px; }
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a href="index.html" class="logo">
      <img src="img/wizard-logo.png" alt="Wizard by Pearson" class="logo-img">
    </a>
    <span class="track-pill" style="background: #ef4444; color: #fff;">Painel da Secretaria</span>
  </div>
</header>

<main class="admin-wrap">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px;">
    <div>
      <h1 style="font-size: 22px; color: var(--navy);">Controle de Pedidos & Notificações SAF</h1>
      <p style="font-size: 13px; color: var(--gray);">Acompanhe e solicite o material didático após a confirmação do pagamento.</p>
    </div>
    <div>
      <button onclick="carregarPedidos()" class="btn-action btn-refresh">🔄 Atualizar Tabela</button>
      <button onclick="gerarExemploTeste()" class="btn-action btn-demo">➕ Simular Aluno Pago</button>
      <button onclick="limparTabela()" class="btn-action btn-clear">🗑️ Limpar</button>
    </div>
  </div>

  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Aluno</th>
          <th>Matrícula</th>
          <th>Unidade</th>
          <th>Responsável / Whats</th>
          <th>Data</th>
          <th>Pagamento</th>
          <th>Status SAF</th>
        </tr>
      </thead>
      <tbody id="pedidos-tbody">
        <!-- Preenchido via JS -->
      </tbody>
    </table>
  </div>
</main>

<script>
  function carregarPedidos() {
    const tbody = document.getElementById('pedidos-tbody');
    let pedidos = [];
    
    try {
      pedidos = JSON.parse(localStorage.getItem('pedidos_secretaria') || '[]');
    } catch (e) {
      console.error("Erro ao ler pedidos:", e);
      pedidos = [];
    }

    if (!pedidos || pedidos.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="8" style="text-align:center; padding: 40px; color: var(--gray);">
            Nenhum pagamento registrado.<br><br>
            <small>Clique no botão <strong>"➕ Simular Aluno Pago"</strong> acima para gerar um teste na hora ou faça um fluxo completo pelo site!</small>
          </td>
        </tr>`;
      return;
    }

    tbody.innerHTML = pedidos.map((p, index) => {
      const whatsApenasNumeros = p.whatsapp ? String(p.whatsapp).replace(/\D/g, '') : '';
      
      return `
        <tr>
          <td><strong>${p.id || 'PED-000'}</strong></td>
          <td><strong>${p.aluno || 'Não informado'}</strong><br><small style="color:var(--gray)">CPF: ${p.cpf || 'N/A'}</small></td>
          <td><code>${p.matricula || 'N/A'}</code></td>
          <td>${p.unidade || 'N/A'}</td>
          <td>
            ${p.responsavel || 'N/A'}<br>
            ${whatsApenasNumeros ? `<a href="https://wa.me/55${whatsApenasNumeros}" target="_blank" style="color: #16a34a; font-weight:700; text-decoration:none; font-size:12px;">📱 WhatsApp</a>` : ''}
          </td>
          <td>${p.data || 'Hoje'}</td>
          <td><span class="badge-pago">${p.pagamento || '✅ Pago'}</span></td>
          <td>
            <select class="status-select" onchange="atualizarStatusSaf(${index}, this.value)">
              <option value="🟡 Solicitar" ${p.statusSaf === '🟡 Solicitar' ? 'selected' : ''}>🟡 Solicitar</option>
              <option value="🟢 Solicitado SAF" ${p.statusSaf === '🟢 Solicitado SAF' ? 'selected' : ''}>🟢 Solicitado SAF</option>
              <option value="🟣 Recebido" ${p.statusSaf === '🟣 Recebido' ? 'selected' : ''}>🟣 Recebido</option>
              <option value="✅ Entregue" ${p.statusSaf === '✅ Entregue' ? 'selected' : ''}>✅ Entregue</option>
            </select>
          </td>
        </tr>
      `;
    }).join('');
  }

  function atualizarStatusSaf(index, novoStatus) {
    const pedidos = JSON.parse(localStorage.getItem('pedidos_secretaria') || '[]');
    if(pedidos[index]) {
      pedidos[index].statusSaf = novoStatus;
      localStorage.setItem('pedidos_secretaria', JSON.stringify(pedidos));
    }
  }

  function gerarExemploTeste() {
    const pedidosExistentes = JSON.parse(localStorage.getItem('pedidos_secretaria') || '[]');
    const nomes = ['João Silva', 'Maria Souza', 'Pedro Lima', 'Lucas Santos'];
    const unidades = ['Laranjeiras', 'Camburi', 'Itaparica', 'Praia da Costa'];
    const idSorteado = Math.floor(Math.random() * nomes.length);

    const novoTeste = {
      id: 'PED-' + Math.floor(1000 + Math.random() * 9000),
      aluno: nomes[idSorteado],
      cpf: '123.456.789-00',
      matricula: Math.floor(10000 + Math.random() * 90000),
      unidade: unidades[idSorteado],
      responsavel: 'Responsável ' + nomes[idSorteado].split(' ')[0],
      whatsapp: '(27) 99999-8888',
      email: 'teste@email.com',
      data: new Date().toLocaleDateString('pt-BR'),
      pagamento: '✅ Pago',
      statusSaf: '🟡 Solicitar'
    };

    pedidosExistentes.unshift(novoTeste);
    localStorage.setItem('pedidos_secretaria', JSON.stringify(pedidosExistentes));
    carregarPedidos();
  }

  function limparTabela() {
    if(confirm("Deseja apagar todos os testes da tabela?")) {
      localStorage.removeItem('pedidos_secretaria');
      carregarPedidos();
    }
  }

  // Executa imediatamente ao abrir
  document.addEventListener('DOMContentLoaded', carregarPedidos);
  window.onload = carregarPedidos;
</script>
</body>
</html>
